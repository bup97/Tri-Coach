<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Langdistanz Coach – Challenge Roth 2027</title>

<!-- iOS: "zum Home-Bildschirm hinzufügen" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Roth Coach" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<!-- Android / generic PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B3A57" />
<link rel="icon" href="icons/icon-192.png" />

<style>
  html, body { margin: 0; padding: 0; background: #F7F4EF; }
  body {
    /* Respect the iPhone notch / home indicator when running fullscreen from the home screen */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  #root { min-height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>

  <!--
    Fehler-Fänger: zeigt eine Absturzmeldung direkt auf der Seite an,
    statt dass die App nur weiß/leer bleibt. Damit lässt sich ein Fehler
    auch ohne Browser-Konsole (z. B. auf dem iPhone) ablesen und weitergeben.
    Kann dauerhaft drin bleiben.
  -->
  <script>
    (function () {
      var shown = false;
      function showError(msg) {
        if (shown) return;
        shown = true;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="padding:20px;font-family:-apple-system,monospace;' +
          'font-size:13px;line-height:1.5;color:#B3423F;white-space:pre-wrap;' +
          'word-break:break-word;">' +
          '<strong>Fehler beim Laden der App:</strong>\n\n' +
          msg.replace(/</g, "&lt;") +
          '</div>';
      }
      window.addEventListener("error", function (e) {
        showError(
          (e.message || "Unbekannter Fehler") +
          "\n(" + (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?") + ")"
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        showError("Promise-Fehler: " + (r && (r.stack || r.message) ? (r.stack || r.message) : String(r)));
      });
    })();
  </script>

  <script src="app.bundle.js"></script>
</body>
</html>
